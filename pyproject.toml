[project]
name = "roskazna-kbs-execution"
version = "0.1.0"
description = "Сбор, разбор и база данных отчётов Федерального казначейства об исполнении консолидированных бюджетов субъектов РФ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests[socks]>=2.31",
    "certifi",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "duckdb>=1.1",
    "pyarrow>=15",
    "rarfile>=4.1",   # RAR-архивы в пакетах до 2012 г.; нужен системный unrar или bsdtar
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Тетрадка docs/examples.ipynb
notebook = ["pandas>=2.2", "matplotlib>=3.9", "jupyter>=1.1", "nbconvert>=7.16"]

[project.scripts]
roskazna-kbs = "roskazna_kbs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roskazna_kbs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
